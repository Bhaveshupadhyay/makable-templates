name: Remove Template

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Category ID (e.g. dev-portfolio)'
        required: true
        type: string
        default: 'dev-portfolio'
      id:
        description: 'Template ID to remove (e.g. clean-dev)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Checkout existing gh-pages into out/
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: out
        continue-on-error: true

      - name: Remove template and regenerate catalogs
        run: |
          bun --bun scripts/remove.ts --category "${{ inputs.category }}" --id "${{ inputs.id }}"

      - name: Commit and push changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add templates/
          if git diff --staged --quiet; then
            echo "No template changes on main to commit"
          else
            git commit -m "chore(templates): remove ${{ inputs.category }}/${{ inputs.id }}"
            git push origin main
          fi

      - name: Deploy to gh-pages branch
        run: |
          touch out/.nojekyll
          cd out
          if [ ! -d ".git" ]; then
            git init -b gh-pages
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No gh-pages changes to commit"
          else
            git commit -m "chore(catalog): remove ${{ inputs.category }}/${{ inputs.id }}"
            git push -u origin gh-pages
          fi
